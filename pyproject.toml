[project]
name = "baresip-speakerphone-mcp"
version = "1.0"
description = "A SIP speakerphone for voice assistants: baresip on a USB speakerphone, caller announcements over Wyoming TTS, call control over MCP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp>=2.3,<3", "uvicorn>=0.30"]

[project.scripts]
speakerphone = "speakerphone.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakerphone"]
